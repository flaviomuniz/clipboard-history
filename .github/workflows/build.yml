name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: |
          swiftc ClipboardHistorySimple.swift \
            -o ClipboardHistory \
            -framework SwiftUI \
            -framework AppKit \
            -framework ServiceManagement \
            -O

      - name: Verify executable
        run: file ClipboardHistory
