name: Code of Conduct report
description: Ask the maintainer for a private way to report a Code of Conduct violation
title: "[Conduct]: private contact request"
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Don't describe the incident or name anyone here. Submit it as it is, and the maintainer will reply with a private way to send the details, as the [Code of Conduct](https://github.com/flaviomuniz/clipboard-history/blob/main/CODE_OF_CONDUCT.md) describes.
  - type: checkboxes
    id: no-details
    attributes:
      label: Before you submit
      options:
        - label: This issue doesn't describe the incident or name the people involved.
          required: true
