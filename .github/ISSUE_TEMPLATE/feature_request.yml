name: Feature request
description: Suggest an idea for ClipboardHistory
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [Roadmap](https://github.com/flaviomuniz/clipboard-history#roadmap) first: your idea may already be planned. If you want to build it yourself, say so below so we can agree on the approach before you start.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: "I often need to ... and today I have to ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Other ways to solve it, or how other clipboard managers handle it.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on this?
      options:
        - "Yes, I'd like to open a PR"
        - "Maybe, with some guidance"
        - "No"
    validations:
      required: true
