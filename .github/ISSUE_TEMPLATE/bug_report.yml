name: Bug report
description: Something in ClipboardHistory doesn't work as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a security problem, don't use this form: see [SECURITY.md](https://github.com/flaviomuniz/clipboard-history/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the history with ⇧⌘V
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: ClipboardHistory supports macOS 13 (Ventura) or later.
      placeholder: "e.g. macOS 15.1"
    validations:
      required: true
  - type: dropdown
    id: mac-chip
    attributes:
      label: Mac
      options:
        - Apple Silicon (M1 or later)
        - Intel
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version or commit
      description: The version shown in About, or the commit you built from (`git rev-parse --short HEAD`).
      placeholder: "e.g. 1.1.0 / 66ccd25"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      description: Anything from Console.app or the terminal. This is formatted as code automatically.
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here if they help. Blur anything private you copied.
